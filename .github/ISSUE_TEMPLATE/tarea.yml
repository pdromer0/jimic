name: Tarea
description: Trabajo planificado que se hace con plan, rama y pull request.
labels: ["tipo:tarea"]
body:
  - type: markdown
    attributes:
      value: |
        Nada personal: si hace falta un ejemplo, invéntalo.

        El issue resume y enlaza la especificación; no la copia. Las dependencias se marcan con las
        nativas de GitHub (Relationships → Blocked by). El PR que la cierra lleva «Closes #N».
  - type: textarea
    id: objetivo
    attributes:
      label: Objetivo
      description: Qué cambia cuando la tarea termina, en dos o tres frases.
    validations:
      required: true
  - type: textarea
    id: contenido
    attributes:
      label: Contenido
      description: Qué incluye, resumido.
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Criterios de aceptación
      description: De 3 a 6 viñetas comprobables.
    validations:
      required: true
  - type: input
    id: especificacion
    attributes:
      label: Enlace a la especificación
      placeholder: docs/specs/hito-N.md#seccion
  - type: input
    id: rama
    attributes:
      label: Rama
      placeholder: feat/…
  - type: input
    id: modelo
    attributes:
      label: Modelo y esfuerzo
      placeholder: "Opus alto (crítica o instrucciones) · Sonnet medio (mecánica)"
  - type: textarea
    id: motivo-dependencias
    attributes:
      label: Motivo de las dependencias
      description: Por qué depende de otras tareas. Las dependencias en sí, con las nativas.
