name: Bug
description: Algo no funciona como debería.
labels: ["tipo:bug"]
body:
  - type: markdown
    attributes:
      value: "Nada personal: si hace falta un ejemplo, invéntalo."
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
    validations:
      required: true
  - type: textarea
    id: que-deberia
    attributes:
      label: Qué debería pasar
    validations:
      required: true
  - type: textarea
    id: reproducir
    attributes:
      label: Cómo reproducirlo
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit o versión
  - type: textarea
    id: salida
    attributes:
      label: Salida
      render: text
