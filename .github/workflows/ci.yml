# Un job: pre-commit en todos los ficheros (los commits de la nube o hechos desde GitHub no
# pasan por los hooks locales) y la suite completa. Versiones: ver hechos-volatiles.md.
# Las acciones van fijadas por el SHA del commit, con la versión en el comentario (ADR 0002).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      # Los entornos de pre-commit (gitleaks se compila con Go): se rehacen solo si cambia
      # .pre-commit-config.yaml. Un PR lee la caché de main o la suya; solo se guarda en verde.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: uv run pre-commit run --all-files --show-diff-on-failure
      - run: uv run pytest
