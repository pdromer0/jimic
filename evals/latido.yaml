# Escenarios de la evaluación del latido (tarea 1.9, capa 3 de 13.2 del diseño).
#
# TODO ES INVENTADO: personas, tareas, eventos, entrenos y cifras. Nada sale del piloto ni de los
# datos de Pedro (decisión 43); los casos reales irán fuera del repositorio con este formato.
#
# Se lanza a mano: `JIMIC_ENTORNO=dev uv run jimic evaluar latido` (README de esta carpeta).
#
# Formato:
# - `base`: el día base. Cada escenario dice solo lo que cambia sobre él o, con `like: <id>`,
#   sobre un escenario anterior (hereda su estado; nunca `now`, `expected`, `why` ni `pending`).
# - Un cambio sustituye la lista entera (`events`, `tasks`, `sent_today`, `waiting`) o la
#   sección de APEX (`meta`, `plan`, `entrenamientos`...). Horas locales, sin zona.
# - `sent_today`: lo enviado hoy; lo de la misma hora salió en un solo mensaje (decisión 92).
# - `unavailable`: las fuentes caídas (`calendar`, `tasks`, `apex`) con su código.
# - `expected`: los conjuntos aceptables de intenciones, sin orden; `[]` es callar.
# - `pending: "<tarea>"`: el programa lo salta y lo cuenta aparte hasta esa tarea.
#
# Rutina del día base (contexto para quien lee; Haiku no la recibe): se levanta a las 7:00,
# café hacia las 7:40 y jornada de 9:30 a 18:30. Límites: los de la plantilla de limites.yaml.

base:
  day: "2030-01-10"   # jueves
  timezone: Europe/Madrid
  intentions:
    intentions:
      - id: plan_del_dia
        type: daily_plan
        purpose: Proponer el plan del día
        window: {from: "07:30", to: "09:30"}
        default_time: "08:00"
        priority: high
      - id: cierre_del_dia
        type: day_close
        purpose: Cerrar el día
        window: {from: "21:00", to: "22:30"}
        default_time: "22:00"
        priority: high
      - id: insistir_gimnasio
        type: key_task
        purpose: Que no se me pase el gimnasio
        habit: gimnasio
        grace: 45m
        max_per_day: 3
        default_time: "13:00"
        priority: high
      - id: insistir_ofertas
        type: key_task
        purpose: Que no se me pase revisar las ofertas
        habit: ofertas
        grace: 45m
        max_per_day: 3
        default_time: "17:15"
        priority: high
      - id: regar
        type: notice
        purpose: Recordar regar las plantas
        days: [mon, thu]
        default_time: "19:00"
        priority: low
      - id: reciclar
        type: notice
        purpose: Sacar el reciclaje
        days: [thu]
        default_time: "19:00"
        priority: medium
      - id: basura
        type: notice
        purpose: Sacar la basura
        days: [mon, tue, wed, thu, fri, sat, sun]
        default_time: "21:00"
        priority: medium
    habits:
      - {id: gimnasio, name: Gimnasio, priority: high, duration: 75m, moment: midday,
         todoist_task: Gimnasio}
      - {id: ofertas, name: Revisar ofertas, priority: high, duration: 30m, moment: afternoon,
         todoist_task: Revisar ofertas}
  events:
    - {title: Reunión de equipo, start: "2030-01-10T10:00", end: "2030-01-10T11:00"}
  tasks:
    - {id: t-gimnasio, title: Gimnasio, due: "2030-01-10T12:00", duration_minutes: 75}
    - {id: t-ofertas, title: Revisar ofertas, due: "2030-01-10T16:30", duration_minutes: 30}
  # El fichero inventado de tests/apex_data.py, trasladado tres días: sincronizado hoy a las
  # 8:15, hoy toca «Cardio suave» y aún no consta ningún entreno de hoy.
  apex:
    meta: {ultima_actualizacion: "2030-01-10 08:15:00", version: 3}
    atleta: {nombre: Persona Inventada}
    plan:
      inicio: "2030-01-01"
      fin: "2030-02-28"
      estructura_semanal:
        "0": Empuje · fuerza
        "1": Movilidad
        "2": Tracción · fuerza
        "3": Cardio suave
        "4": Pierna · fuerza
        "5": Paseo largo
        "6": Descanso
    entrenamientos:
      - {id: inventado-1, fecha: "2030-01-09", tipo: fuerza, nombre: Pierna A,
         duracion_min: 62.0, fuente: inventada, ejercicios: []}
    objetivos:
      - {id: obj_fuerza, prioridad: 1, desc: Subir la fuerza, meta: Sentadilla 100 kg,
         estado: en curso, progreso_pct: 40, color: "#000000"}
      - {id: obj_pasos, prioridad: 2, desc: Moverse más, meta: 8000 pasos de media,
         estado: en curso, media_pasos: 6000}
    biometricos:
      sueno_horas: [{fecha: "2030-01-09", valor: 6.5, fuente: inventada}]
      peso: [{fecha: "2030-01-05", valor: 70.0, fuente: inventada}]
    marcas: {}
  sent_today: []
  waiting: []

