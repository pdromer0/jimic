  tasks:
    - {id: t-comida, title: Comida, due: "2030-01-10T14:00", duration_minutes: 60}
  # Sincronizado hoy a las 7:30: hoy (jueves) toca «Pierna · fuerza» y el último entreno fue ayer.
  apex:
    meta: {ultima_actualizacion: "2030-01-10 07:30:00", version: 3}
    atleta: {nombre: Persona Inventada}
    plan:
