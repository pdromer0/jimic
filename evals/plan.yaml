      | Tarea | Icono |
      | --- | --- |
      | Gimnasio | 🏋️ |
      | Revisar ofertas | 💼 |
      | Estiramientos | 🧘 |
      | Comida | 🍽️ |
      | Cena | 🍽️ |
    intenciones.yaml: |
      intentions:
        - id: plan_del_dia
          type: daily_plan
          purpose: "Proponer el plan del día"
          window: {from: "07:30", to: "09:30"}
          default_time: "08:00"
          priority: high
        - id: cierre_del_dia
          type: day_close
          purpose: "Cerrar el día"
          window: {from: "21:00", to: "22:30"}
          default_time: "22:00"
          priority: high
      habits:
        - {id: gimnasio, name: "Gimnasio", priority: high, duration: 75m, moment: midday,
           todoist_task: "Gimnasio"}
        - {id: ofertas, name: "Revisar ofertas", priority: high, duration: 30m,
           moment: afternoon, todoist_task: "Revisar ofertas"}
        - {id: estiramientos, name: "Estiramientos", priority: medium, duration: 15m,
           moment: evening, todoist_task: "Estiramientos"}
        - {id: cena, name: "Cena", priority: medium, duration: 45m, moment: evening,
           todoist_task: "Cena"}
        - {id: lectura, name: "Lectura", priority: low, duration: 20m, moment: evening,
           todoist_task: "Lectura"}
  events:
