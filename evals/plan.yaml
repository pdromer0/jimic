# Escenarios de la evaluación del plan del día (tarea 1.14, decisión 1.14-f).
#
# TODO ES INVENTADO: la persona, sus ficheros, sus tareas, sus eventos y sus entrenos. Seis
# escenarios destilan casos del piloto (e01, e02, e03, e04, e06, e07, e09) con datos nuevos; lo
# bruto del piloto no entra aquí (decisión 43).
#
# Se lanza a mano: `JIMIC_ENTORNO=dev uv run jimic evaluar plan` (README de esta carpeta).
#
# Formato:
# - `base`: el día base, entero: la hora del plan, los ficheros personales (limites.yaml es la
#   plantilla), los eventos, las tareas abiertas, APEX y los cambios de memoria ya guardados.
# - Cada escenario dice solo lo que cambia, sobre el día base o, con `like: <id>`, sobre uno
#   anterior. Una lista sustituye a la lista entera; un fichero, a ese fichero; una sección de
#   APEX, a esa sección. Horas locales, sin zona.
# - `before` y `after`: mensajes de Pedro antes y después del plan, en la misma conversación.
# - `checks` corrigen la ejecución del plan; `checks_after`, la del último mensaje de `after`.
#   El catálogo está en src/jimic/evals/plan_checks.py.

base:
  day: "2030-01-10"   # jueves
  now: "07:45"
  timezone: Europe/Madrid
  files:
    rutina.md: |
      # Rutina

      ## Horario base

      - Me levanto a las 7:00 y me acuesto hacia las 23:30.

      ## Comidas

      - Como hacia las 14:00 y ceno hacia las 21:00.

      ## Jornada

      - Trabajo de 9:30 a 18:30, de lunes a viernes.

      ## Fines de semana

      - Sin horario fijo.
    objetivos.md: |
      # Objetivos

      ## Gestión del tiempo

      Meta: cumplir el plan del día.
      Prioridad: alta

      - [medible] Plan del día cumplido 4 de cada 5 días laborables.

      ## Entrenamiento

      Meta: entrenar cuatro días por semana.
      Prioridad: alta

      ## Hábitos

      Meta: revisar las ofertas de empleo cada tarde.
      Prioridad: media

      ## Nutrición

      Prioridad: ahora no

      ## Salud

      Prioridad: ahora no

      ## Trabajo y proyectos personales

      Meta: avanzar el proyecto personal por las tardes.
      Prioridad: media

      ## Empleo

      Prioridad: ahora no

      ## Ocio

      Prioridad: ahora no

      ## Social

      Prioridad: ahora no
    preferencias.md: |
      # Preferencias

      - Mensajes cortos y con humor.

      ## Iconos

      | Tarea | Icono |
      | --- | --- |
      | Gimnasio | 🏋️ |
      | Revisar ofertas | 💼 |
      | Estiramientos | 🧘 |
      | Comida | 🍽️ |
      | Cena | 🍽️ |
    intenciones.yaml: |
      intentions:
        - id: plan_del_dia
          type: daily_plan
          purpose: "Proponer el plan del día"
          window: {from: "07:30", to: "09:30"}
          default_time: "08:00"
          priority: high
        - id: cierre_del_dia
          type: day_close
          purpose: "Cerrar el día"
          window: {from: "21:00", to: "22:30"}
          default_time: "22:00"
          priority: high
      habits:
        - {id: gimnasio, name: "Gimnasio", priority: high, duration: 75m, moment: midday,
           todoist_task: "Gimnasio"}
        - {id: ofertas, name: "Revisar ofertas", priority: high, duration: 30m,
           moment: afternoon, todoist_task: "Revisar ofertas"}
        - {id: estiramientos, name: "Estiramientos", priority: medium, duration: 15m,
           moment: evening, todoist_task: "Estiramientos"}
        - {id: cena, name: "Cena", priority: medium, duration: 45m, moment: evening,
           todoist_task: "Cena"}
        - {id: lectura, name: "Lectura", priority: low, duration: 20m, moment: evening,
           todoist_task: "Lectura"}
  events:
    - {title: Reunión de equipo, start: "2030-01-10T10:00", end: "2030-01-10T11:00"}
  tasks:
    - {id: t-comida, title: Comida, due: "2030-01-10T14:00", duration_minutes: 60}
  # Sincronizado hoy a las 7:30: hoy (jueves) toca «Pierna · fuerza» y el último entreno fue ayer.
  apex:
    meta: {ultima_actualizacion: "2030-01-10 07:30:00", version: 3}
    atleta: {nombre: Persona Inventada}
    plan:
      inicio: "2030-01-01"
      fin: "2030-02-28"
      estructura_semanal:
        "0": Empuje · fuerza
        "1": Movilidad
        "2": Cardio suave
        "3": Pierna · fuerza
        "4": Tracción · fuerza
        "5": Paseo largo
        "6": Descanso
    entrenamientos:
      - {id: inventado-1, fecha: "2030-01-09", tipo: cardio, nombre: Cardio suave,
         duracion_min: 35.0, fuente: inventada, ejercicios: []}
    objetivos:
      - {id: obj_fuerza, prioridad: 1, desc: Subir la fuerza, meta: Sentadilla 100 kg,
         estado: en curso, progreso_pct: 40, color: "#000000"}
    biometricos:
      sueno_horas: [{fecha: "2030-01-09", valor: 6.5, fuente: inventada}]
    marcas: {}
  changes: []

scenarios:
  - id: p01
    title: Mañana normal
    origin: nuevo
    checks:
      - {includes_habit: gimnasio}
      - {includes_habit: ofertas}
      - {max_new: 4}
      - no_overlap
      - no_duplicates
      - due_from_now

  - id: p02
    title: Plan tardío a las 12:30 con lo de la mañana sin marcar
    origin: e01
    now: "12:30"
    tasks:
      - {id: t-meditacion, title: Meditación, due: "2030-01-10T07:10"}
      - {id: t-estiramientos, title: Estiramientos, due: "2030-01-10T08:05",
         duration_minutes: 15}
      - {id: t-webinar, title: Webinar de innovación, due: "2030-01-10T10:00"}
      - {id: t-comida, title: Comida, due: "2030-01-10T15:00", duration_minutes: 60}
      - {id: t-paseo, title: Paseo 5 km, due: "2030-01-10T19:00", duration_minutes: 60}
    events:
      - {title: Webinar de innovación, start: "2030-01-10T09:50", end: "2030-01-10T11:00"}
      - {title: Trabajo en el proyecto, start: "2030-01-10T15:30", end: "2030-01-10T19:00"}
    checks:
      - due_from_now
      - no_duplicates
      - no_overlap
      - {no_move: t-webinar}
      - {no_item_on: [t-meditacion, t-estiramientos, t-webinar]}
    why: Lo de la mañana sin marcar lo ve el cierre; el webinar ya pasó, así que no hay incoherencia.

  - id: p03
    title: Atrasadas de ayer que duplican las de hoy
    origin: e03
    tasks:
      - {id: t-estiramientos-ayer, title: "Estiramientos: rutina de movilidad",
         due: "2030-01-09T07:35", duration_minutes: 15}
      - {id: t-andar-ayer, title: Andar 5 km, due: "2030-01-09T19:00", duration_minutes: 60}
      - {id: t-gimnasio-ayer, title: Gimnasio, due: "2030-01-09T13:00", duration_minutes: 75}
      - {id: t-estiramientos, title: Estiramientos, due: "2030-01-10T08:05",
         duration_minutes: 15}
      - {id: t-paseo, title: Paseo 5 km, due: "2030-01-10T19:00", duration_minutes: 60}
      - {id: t-comida, title: Comida, due: "2030-01-10T14:00", duration_minutes: 60}
    checks:
      - {deletes_exactly: [t-estiramientos-ayer, t-andar-ayer]}
      - {no_delete: t-gimnasio-ayer}
      - {moves: [t-gimnasio-ayer, hoy]}
      - {no_create_title: Gimnasio}
    why: >-
      Las dos atrasadas duplican por intención a dos de hoy: se borran. El gimnasio de ayer no
      duplica nada de hoy: se trae a hoy, nunca se crea otro.

  - id: p04
    title: Tarde ocupada por el proyecto, sin ofertas ni cena hoy
    origin: e04
    now: "11:15"
    before:
      - {at: "10:30", text: "Esta tarde me pongo con el proyecto"}
    events:
      - {title: Reunión de equipo, start: "2030-01-10T10:00", end: "2030-01-10T11:00"}
      - {title: Trabajo en el proyecto, start: "2030-01-10T15:00", end: "2030-01-10T21:00"}
    checks:
      - {includes_habit: ofertas}
      - {includes_habit: cena}
      - no_overlap
      - {max_new: 4}
    why: Pedro habla del proyecto, no de las ofertas; un hábito de alta sigue entrando.

  - id: p05
    title: Pedro contesta al plan y pide cambios
    origin: e06
    now: "12:00"
    tasks:
      - {id: t-comida, title: Comida, due: "2030-01-10T15:00", duration_minutes: 60}
      - {id: t-estiramientos, title: Estiramientos, due: "2030-01-10T14:30",
         duration_minutes: 15}
    after:
      - {at: "12:10",
         text: "OK al plan. Quita los estiramientos y pasa la revisión de ofertas a las 14:30"}
    checks_after:
