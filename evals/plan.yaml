# Escenarios de la evaluación del plan del día (tarea 1.14, decisión 1.14-f).
#
# TODO ES INVENTADO: la persona, sus ficheros, sus tareas, sus eventos y sus entrenos. Seis
# escenarios destilan casos del piloto (e01, e02, e03, e04, e06, e07, e09) con datos nuevos; lo
# bruto del piloto no entra aquí (decisión 43).
#
# Se lanza a mano: `JIMIC_ENTORNO=dev uv run jimic evaluar plan` (README de esta carpeta).
#
# Formato:
# - `base`: el día base, entero: la hora del plan, los ficheros personales (limites.yaml es la
#   plantilla), los eventos, las tareas abiertas, APEX y los cambios de memoria ya guardados.
# - Cada escenario dice solo lo que cambia, sobre el día base o, con `like: <id>`, sobre uno
#   anterior. Una lista sustituye a la lista entera; un fichero, a ese fichero; una sección de
#   APEX, a esa sección. Horas locales, sin zona.
# - `before` y `after`: mensajes de Pedro antes y después del plan, en la misma conversación.
# - `checks` corrigen la ejecución del plan; `checks_after`, la del último mensaje de `after`.
#   El catálogo está en src/jimic/evals/plan_checks.py. Cada comprobación es una regla dura o de
#   criterio (decisión 131); `tipo: dura` la cambia en un escenario (p07, H1-9).
# - `cierre` (tarea 1.16): el cierre del día con el agente de verdad escribiendo la nota. Sobre el
#   día base: la hora, las tareas abiertas (también las de mañana), las completadas hoy
#   (`completed`, con su hora), los eventos (también los de mañana), las tareas del plan (`plan`)
#   y el estado de las tareas clave (`keys`).
# - `memoria` (tarea 1.16, CU-13): los mensajes de Pedro al agente sobre su memoria; se corrige el
#   último.

base:
  day: "2030-01-10"   # jueves
  now: "07:45"
  timezone: Europe/Madrid
  files:
    rutina.md: |
      # Rutina

      ## Horario base

      - Me levanto a las 7:00 y me acuesto hacia las 23:30.

      ## Comidas

      - Como hacia las 14:00 y ceno hacia las 21:00.

      ## Jornada

      - Trabajo de 9:30 a 18:30, de lunes a viernes.

      ## Fines de semana

      - Sin horario fijo.
    objetivos.md: |
      # Objetivos

      ## Gestión del tiempo

      Meta: cumplir el plan del día.
      Prioridad: alta

      - [medible] Plan del día cumplido 4 de cada 5 días laborables.

      ## Entrenamiento

      Meta: entrenar cuatro días por semana.
      Prioridad: alta

      ## Hábitos

      Meta: revisar las ofertas de empleo cada tarde.
      Prioridad: media

      ## Nutrición

      Prioridad: ahora no

      ## Salud

      Prioridad: ahora no

      ## Trabajo y proyectos personales

      Meta: avanzar el proyecto personal por las tardes.
      Prioridad: media

      ## Empleo

      Prioridad: ahora no

      ## Ocio

      Prioridad: ahora no

      ## Social

      Prioridad: ahora no
