  - id: p06
    title: Ha aprendido que entre semana no quiere estiramientos
    origin: e07
    files:
      preferencias.md: |
        # Preferencias

        - Mensajes cortos y con humor.
        - No me propongas estiramientos entre semana, solo el fin de semana.

        ## Iconos

        | Tarea | Icono |
        | --- | --- |
        | Gimnasio | 🏋️ |
        | Revisar ofertas | 💼 |
        | Estiramientos | 🧘 |
        | Comida | 🍽️ |
        | Cena | 🍽️ |
    changes:
