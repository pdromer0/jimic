# Ruff y pyright se ejecutan con la versión de uv.lock (repo local): la misma que usan el hook
# PostToolUse de Claude Code y el CI. Las versiones de pre-commit-hooks y gitleaks: ver
# hechos-volatiles.md.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types_or: [python, pyi, jupyter]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi, jupyter]
      - id: pyright
        name: pyright
        entry: uv run --frozen pyright
        language: system
        pass_filenames: false
        types: [python]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
